<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quest map — WordSpark</title>
  <meta name="description" content="Choose your next letter and word quest on the WordSpark map.">
  <meta property="og:title" content="Quest map — WordSpark">
  <meta property="og:description" content="Choose your next letter and word quest.">
  <meta property="og:type" content="website">
  <style>
    :root {
      --bg: #fff8ec;
      --card: #ffffff;
      --ink: #2b2a33;
      --muted: #7a7788;
      --brand: #ff7a2f;
      --brand-dark: #d95f18;
      --green: #3fb67a;
      --locked: #e9e6ef;
      --radius: 20px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, "Noto Sans Devanagari", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    header {
      display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
      justify-content: space-between;
      padding: 12px 20px; background: var(--card);
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }
    .logo { font-weight: 800; font-size: 1.4rem; color: var(--brand); text-decoration: none; }
    .header-right { display: flex; align-items: center; gap: 14px; }
    .stars { font-weight: 700; }
    select {
      padding: 6px 10px; border-radius: 10px; border: 1px solid #d8d4e2;
      font-size: .95rem; background: #fff;
    }
    nav {
      display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
      padding: 12px; background: var(--card); border-top: 1px solid #f0ece3;
    }
    nav a {
      text-decoration: none; color: var(--ink); padding: 8px 16px;
      border-radius: 999px; font-weight: 600; font-size: .95rem;
    }
    nav a.active { background: var(--brand); color: #fff; }
    nav a:hover:not(.active) { background: #ffe9d6; }
    main { max-width: 640px; margin: 0 auto; padding: 24px 16px 60px; }
    .hello { display: flex; align-items: center; gap: 16px; margin-bottom: 8px; }
    .mascot {
      width: 72px; height: 72px; border-radius: 50%;
      background: #ffe2c4; display: grid; place-items: center; font-size: 2.2rem;
    }
    h1 { margin: 0; font-size: 2rem; }
    h2 { margin: 24px 0 12px; font-size: 1.2rem; color: var(--muted); }
    ol { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
    .quest {
      display: flex; align-items: center; gap: 16px;
      padding: 16px 18px; border-radius: var(--radius);
      background: var(--card); text-decoration: none; color: inherit;
      box-shadow: 0 4px 12px rgba(0,0,0,.07);
      border: 2px solid transparent; transition: transform .15s, border-color .15s;
    }
    a.quest:hover { transform: translateY(-2px); border-color: var(--brand); }
    .quest.locked { background: var(--locked); color: var(--muted); cursor: not-allowed; box-shadow: none; }
    .icon { font-size: 2rem; width: 48px; text-align: center; }
    .info { flex: 1; }
    .title { font-weight: 800; font-size: 1.1rem; }
    .desc { font-size: .92rem; color: var(--muted); margin-top: 2px; }
    .rating { font-size: 1.1rem; white-space: nowrap; }
    footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 20px; }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="index.html">WordSpark</a>
    <div class="header-right">
      <span class="stars">⭐ 0</span>
      <label>
        <span class="sr" data-i18n="language">Language</span>
        <select id="lang" aria-label="Language">
          <option value="en">English</option>
          <option value="hi">हिंदी</option>
          <option value="mr">मराठी</option>
        </select>
      </label>
    </div>
  </header>

  <nav>
    <a class="active" href="index.html" data-i18n="navMap">🗺️ Quest map</a>
    <a href="rewards.html" data-i18n="navRewards">🏅 Rewards</a>
    <a href="progress.html" data-i18n="navProgress">📈 My practice</a>
  </nav>

  <main>
    <div class="hello">
      <div class="mascot" aria-hidden="true">🦉</div>
      <h1 data-i18n="hello">Hello!</h1>
    </div>

    <h2 data-i18n="mapTitle">Quest map</h2>

    <ol id="quests"></ol>
  </main>

  <footer>WordSpark</footer>

  <script>
    const I18N = {
      en: {
        language: "Language", navMap: "🗺️ Quest map", navRewards: "🏅 Rewards", navProgress: "📈 My practice",
        hello: "Hello!", mapTitle: "Quest map",
        locked: "Finish the quest before to open this one",
        quests: [
          ["Letter Garden", "Find the letter you see."],
          ["Sound River"], ["Word Bridge"], ["Listening Hill"]
        ]
      },
      hi: {
        language: "भाषा", navMap: "🗺️ क्वेस्ट मैप", navRewards: "🏅 इनाम", navProgress: "📈 मेरा अभ्यास",
        hello: "नमस्ते!", mapTitle: "क्वेस्ट मैप",
        locked: "इसे खोलने के लिए पिछला क्वेस्ट पूरा करो",
        quests: [
          ["अक्षर बगीचा", "जो अक्षर दिखे, उसे ढूँढो।"],
          ["ध्वनि नदी"], ["शब्द पुल"], ["सुनने की पहाड़ी"]
        ]
      },
      mr: {
        language: "भाषा", navMap: "🗺️ क्वेस्ट नकाशा", navRewards: "🏅 बक्षिसे", navProgress: "📈 माझा सराव",
        hello: "नमस्कार!", mapTitle: "क्वेस्ट नकाशा",
        locked: "हे उघडण्यासाठी आधीचा क्वेस्ट पूर्ण करा",
        quests: [
          ["अक्षर बाग", "जे अक्षर दिसेल ते शोधा."],
          ["आवाजाची नदी"], ["शब्दांचा पूल"], ["ऐकण्याची टेकडी"]
        ]
      }
    };

    const ICONS = ["🌼", "🔒", "🔒", "🔒"];
    const LINKS = ["quest/letters.html", null, null, null];

    function render(lang) {
      const t = I18N[lang];
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-i18n]").forEach(el => {
        if (t[el.dataset.i18n]) el.textContent = t[el.dataset.i18n];
      });
      const list = document.getElementById("quests");
      list.innerHTML = "";
      t.quests.forEach((q, i) => {
        const li = document.createElement("li");
        const el = document.createElement(LINKS[i] ? "a" : "div");
        el.className = "quest" + (LINKS[i] ? "" : " locked");
        if (LINKS[i]) el.href = LINKS[i];
        el.innerHTML =
          `<span class="icon">${ICONS[i]}</span>` +
          `<span class="info"><div class="title">${i + 1}. ${q[0]}</div>` +
          `<div class="desc">${q[1] || t.locked}</div></span>` +
          `<span class="rating">⭐⭐⭐</span>`;
        li.appendChild(el);
        list.appendChild(li);
      });
    }

    const select = document.getElementById("lang");
    let saved = "en";
    try { saved = localStorage.getItem("wordspark-lang") || "en"; } catch (e) {}
    select.value = saved;
    render(saved);
    select.addEventListener("change", () => {
      try { localStorage.setItem("wordspark-lang", select.value); } catch (e) {}
      render(select.value);
    });
  </script>
</body>
</html>
